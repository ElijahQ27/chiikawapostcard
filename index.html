<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postcard Art Gallery · Mermaid Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F2F8FC;
    --pink: #CFE9FA;
    --pink-deep: #7FC1E8;
    --mint: #D8F3EE;
    --lavender: #DCE8FF;
    --plum: #2F4A5C;
    --coral: #5FA8DE;
    --card-bg: #FFFFFF;
    --sand: #F9EEC1;
    --water-light: #B3DFF0;
    --water-deep: #6FA8C9;
    --island-green: #A8D8B9;
    --island-shadow: #6B9E7A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream: #1E2A36;
      --card-bg: #263544;
      --plum: #E6F1FA;
      --sand: #C9B88A;
      --water-light: #2F4A5C;
      --water-deep: #1A2E3A;
      --island-green: #4A7A5C;
      --island-shadow: #2C4A36;
    }
  }
  :root[data-theme="dark"] {
    --cream: #1E2A36;
    --card-bg: #263544;
    --plum: #E6F1FA;
    --sand: #C9B88A;
    --water-light: #2F4A5C;
    --water-deep: #1A2E3A;
    --island-green: #4A7A5C;
    --island-shadow: #2C4A36;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--plum);
    font-family: 'Nunito', sans-serif;
    padding: 32px 20px 80px;
    position: relative;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 10% 90%, var(--sand) 0%, transparent 30%),
      radial-gradient(circle at 95% 75%, var(--sand) 0%, transparent 25%),
      radial-gradient(circle at 50% 100%, var(--island-green) 0%, transparent 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 12px),
      linear-gradient(180deg, var(--water-light) 0%, var(--water-deep) 100%);
    background-blend-mode: overlay, overlay, soft-light, normal, normal;
    background-attachment: fixed;
    background-size: cover;
  }

  /* ===== FLOATING BUBBLES & SPARKLES ===== */
  .floaty {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
    animation: drift 9s ease-in-out infinite, bubble 12s linear infinite;
    box-shadow: inset -2px -2px 4px rgba(255,255,255,0.6),
                inset 2px 2px 4px rgba(255,255,255,0.2),
                0 0 8px rgba(255,255,255,0.3);
  }
  .floaty.f1  { top: 8%;   left: 6%;   width: 26px; height: 26px; background: var(--pink);       animation-duration: 8s,  11s; animation-delay: 0s,   0s; }
  .floaty.f2  { top: 65%;  left: 4%;   width: 16px; height: 16px; background: var(--pink-deep);  animation-duration: 10s, 14s; animation-delay: 1s,   0s; }
  .floaty.f3  { top: 18%;  right: 7%;  width: 20px; height: 20px; background: var(--lavender);   animation-duration: 7s,  13s; animation-delay: 0.5s, 2s; }
  .floaty.f4  { top: 78%;  right: 10%; width: 30px; height: 30px; background: var(--pink);       animation-duration: 11s, 16s; animation-delay: 1.5s, 4s; }
  .floaty.f5  { top: 40%;  left: 2%;   width: 12px; height: 12px; background: var(--pink-deep);  animation-duration: 6s,  9s;  animation-delay: 0.3s, 1s; }
  .floaty.f6  { top: 50%;  right: 3%;  width: 14px; height: 14px; background: var(--lavender);   animation-duration: 9s,  15s; animation-delay: 2s,   3s; }

  /* ===== NEW EXTRA BUBBLES ===== */
  .floaty.f7  { top: 25%;  left: 15%;  width: 18px; height: 18px; background: var(--mint);       animation-duration: 8s,  12s; animation-delay: 0.7s, 5s; }
  .floaty.f8  { top: 55%;  left: 22%;  width: 10px; height: 10px; background: var(--pink);       animation-duration: 7s,  10s; animation-delay: 1.2s, 2s; }
  .floaty.f9  { top: 82%;  left: 30%;  width: 22px; height: 22px; background: var(--lavender);   animation-duration: 9s,  17s; animation-delay: 0.4s, 6s; }
  .floaty.f10 { top: 12%;  left: 45%;  width: 14px; height: 14px; background: var(--pink-deep);  animation-duration: 11s, 13s; animation-delay: 1.8s, 3s; }
  .floaty.f11 { top: 70%;  left: 48%;  width: 20px; height: 20px; background: var(--mint);       animation-duration: 6s,  12s; animation-delay: 0.2s, 7s; }
  .floaty.f12 { top: 35%;  left: 60%;  width: 12px; height: 12px; background: var(--pink);       animation-duration: 8s,  14s; animation-delay: 2.2s, 1s; }
  .floaty.f13 { top: 88%;  left: 68%;  width: 24px; height: 24px; background: var(--lavender);   animation-duration: 10s, 18s; animation-delay: 0.9s, 5s; }
  .floaty.f14 { top: 5%;   right: 25%; width: 16px; height: 16px; background: var(--pink-deep);  animation-duration: 7s,  11s; animation-delay: 1.4s, 2s; }
  .floaty.f15 { top: 45%;  right: 18%; width: 28px; height: 28px; background: var(--mint);       animation-duration: 12s, 19s; animation-delay: 0.6s, 8s; }
  .floaty.f16 { top: 92%;  right: 30%; width: 18px; height: 18px; background: var(--pink);       animation-duration: 9s,  15s; animation-delay: 2.5s, 4s; }
  .floaty.f17 { top: 60%;  right: 40%; width: 10px; height: 10px; background: var(--pink-deep);  animation-duration: 6s,  10s; animation-delay: 0.1s, 6s; }
  .floaty.f18 { top: 30%;  right: 50%; width: 22px; height: 22px; background: var(--lavender);   animation-duration: 11s, 16s; animation-delay: 1.7s, 3s; }
  .floaty.f19 { top: 75%;  right: 60%; width: 14px; height: 14px; background: var(--mint);       animation-duration: 8s,  13s; animation-delay: 0.8s, 9s; }
  .floaty.f20 { top: 20%;  left: 75%;  width: 16px; height: 16px; background: var(--pink);       animation-duration: 10s, 14s; animation-delay: 2.1s, 1s; }
  .floaty.f21 { top: 50%;  left: 82%;  width: 12px; height: 12px; background: var(--pink-deep);  animation-duration: 7s,  12s; animation-delay: 0.5s, 7s; }
  .floaty.f22 { top: 85%;  left: 90%;  width: 20px; height: 20px; background: var(--lavender);   animation-duration: 9s,  17s; animation-delay: 1.9s, 2s; }
  .floaty.f23 { top: 10%;  left: 33%;  width: 11px; height: 11px; background: var(--mint);       animation-duration: 6s,  11s; animation-delay: 0.3s, 8s; }
  .floaty.f24 { top: 95%;  left: 15%;  width: 26px; height: 26px; background: var(--pink);       animation-duration: 12s, 20s; animation-delay: 1.1s, 5s; }

  /* extra island / water sprites */
  .floaty.island1 {
    width: 80px; height: 80px; border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%;
    background: var(--island-green);
    opacity: 0.25; top: 15%; right: 12%; animation: islandBob 14s infinite alternate ease-in-out;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: none;
  }
  .floaty.island2 {
    width: 120px; height: 40px; border-radius: 50%;
    background: var(--sand);
    opacity: 0.2; bottom: 8%; left: 5%; animation: islandBob 18s infinite alternate-reverse ease-in-out;
    filter: blur(4px);
    box-shadow: none;
  }

  @keyframes drift {
    0%, 100% { transform: translateY(0) translateX(0) scale(1); }
    50% { transform: translateY(-18px) translateX(8px) scale(1.1); }
  }
  @keyframes bubble {
    0%   { transform: translateY(0) scale(1);    opacity: 0.5; }
    70%  { transform: translateY(-120px) scale(1.3); opacity: 0.15; }
    100% { transform: translateY(-220px) scale(0.8); opacity: 0; }
  }
  @keyframes islandBob {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-12px) rotate(2deg); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }

  .wrap { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 20px; }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 7vw, 48px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    display: inline-block;
    animation: bob 4s ease-in-out infinite;
    color: var(--plum);
    text-shadow: 0 4px 0 rgba(255,255,255,0.5), 0 8px 12px rgba(0,0,0,0.1);
  }
  header p {
    margin: 0 auto;
    max-width: 46ch;
    color: var(--plum);
    opacity: 0.85;
    font-size: 16px;
    line-height: 1.5;
    background: rgba(255,255,255,0.4);
    padding: 6px 18px;
    border-radius: 60px;
    backdrop-filter: blur(4px);
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.6);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }
  @media (min-width: 700px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 32px 28px;
    }
  }
  @media (min-width: 1100px) {
    .grid {
      gap: 40px 36px;
    }
  }

  .card {
    background: var(--card-bg);
    border-radius: 32px;
    padding: 18px;
    box-shadow: 0 12px 0 rgba(0,0,0,0.06), 0 20px 30px -10px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: popIn 0.5s ease backwards;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    border: 2px solid rgba(255,255,255,0.5);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.3) 0%, transparent 60%);
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-8px) rotate(-0.4deg);
    box-shadow: 0 16px 0 rgba(0,0,0,0.07), 0 26px 40px -12px rgba(0,0,0,0.25);
  }

  .frame {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
    background: linear-gradient(160deg, var(--pink) 0%, var(--lavender) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.05);
  }
  .frame:hover {
    transform: scale(1.01);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.15);
  }
  .frame img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .card:hover .frame img { transform: scale(1.06); }
  .frame.placeholder .mascot { width: 46%; }

  .badge {
    position: absolute;
    top: 14px; left: 14px;
    background: rgba(255,255,255,0.92);
    color: var(--island-green);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    backdrop-filter: blur(2px);
    border: 1px solid rgba(255,255,255,0.8);
  }

  .card-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 2px 6px 0;
    color: var(--plum);
  }
  .card-sub {
    margin: -8px 6px 0;
    font-size: 15px;
    opacity: 0.7;
    font-weight: 600;
  }
  .dl-btn {
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    background: var(--coral);
    color: white;
    transition: transform 0.15s ease, background 0.2s;
    box-shadow: 0 6px 0 rgba(0,0,0,0.1);
    letter-spacing: 0.3px;
    margin-top: 4px;
  }
  .dl-btn:not(:disabled):hover { transform: scale(1.02) rotate(-0.5deg); background: #4A9AD6; }
  .dl-btn:active { transform: scale(0.97); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
  .dl-btn:disabled {
    background: #E4DCE8;
    color: #9A8FA8;
    cursor: not-allowed;
    box-shadow: 0 4px 0 #C0B4CC;
  }
  .dl-btn:focus-visible, a:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

  footer {
    text-align: center;
    margin-top: 60px;
    font-size: 14px;
    opacity: 0.7;
    color: var(--plum);
    background: rgba(255,255,255,0.3);
    padding: 12px 20px;
    border-radius: 60px;
    backdrop-filter: blur(4px);
    display: inline-block;
    width: auto;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(255,255,255,0.4);
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }
  .modal.open {
    display: flex;
  }
  .modal img {
    max-width: 95vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    border-radius: 24px;
    box-shadow: 0 30px 50px rgba(0,0,0,0.5);
    border: 4px solid rgba(255,255,255,0.3);
    object-fit: contain;
    animation: popIn 0.35s ease;
    cursor: pointer;
  }
  .modal-close {
    position: absolute;
    top: 20px;
    right: 25px;
    background: rgba(255,255,255,0.2);
    border: 2px solid white;
    color: white;
    font-size: 32px;
    line-height: 1;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    font-family: 'Nunito', sans-serif;
    backdrop-filter: blur(4px);
    z-index: 1001;
  }
  .modal-close:hover {
    background: rgba(255,255,255,0.4);
    transform: scale(1.1) rotate(90deg);
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dl-btn { transition: none; }
    .floaty, h1, .card, .modal img { animation: none !important; }
    .card:hover, .card:hover .frame img, .dl-btn:hover { transform: none; }
    .modal-close:hover { transform: none; }
    .floaty.island1, .floaty.island2 { animation: none; }
  }
</style>
</head>
<body>
<!-- floating elements: bubbles + islands -->
<span class="floaty f1"></span>
<span class="floaty f2"></span>
<span class="floaty f3"></span>
<span class="floaty f4"></span>
<span class="floaty f5"></span>
<span class="floaty f6"></span>
<span class="floaty f7"></span>
<span class="floaty f8"></span>
<span class="floaty f9"></span>
<span class="floaty f10"></span>
<span class="floaty f11"></span>
<span class="floaty f12"></span>
<span class="floaty f13"></span>
<span class="floaty f14"></span>
<span class="floaty f15"></span>
<span class="floaty f16"></span>
<span class="floaty f17"></span>
<span class="floaty f18"></span>
<span class="floaty f19"></span>
<span class="floaty f20"></span>
<span class="floaty f21"></span>
<span class="floaty f22"></span>
<span class="floaty f23"></span>
<span class="floaty f24"></span>
<span class="floaty island1"></span>
<span class="floaty island2"></span>

<div class="wrap">
  <header>
    <h1>Mermaid Island Postcards</h1><br>
    <p>Enjoy your postcard!</p>
  </header>

  <main class="grid" id="gallery"></main>

  <footer>Hayaha puruuru-puruuru yaha - Usagi</footer>
</div>

<!-- Fullscreen image modal -->
<div class="modal" id="imageModal">
  <div class="modal-close" id="modalClose">&times;</div>
  <img id="modalImg" src="" alt="Full size postcard">
</div>

<script>
  const works = [
    { title: "Mong ga", sub: "Stkru", image: "uploads/Screenshot 2026-09-27 184019.png" },
    { title: "Title", sub: "Artist", image: null },
    { title: "Title", sub: "Artist", image: null },
    { title: "Title", sub: "Artist", image: null },
  ];

  const mascotSVG = `
    <svg class="mascot" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="#FFE9B0" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="35" cy="42" r="6" fill="#2F4A5C"/>
      <circle cx="65" cy="42" r="6" fill="#2F4A5C"/>
      <circle cx="37" cy="40" r="2" fill="white"/>
      <circle cx="67" cy="40" r="2" fill="white"/>
      <path d="M40 65 Q50 75 60 65" stroke="#2F4A5C" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="28" cy="55" r="6" fill="#FFB7C5" opacity="0.7"/>
      <circle cx="72" cy="55" r="6" fill="#FFB7C5" opacity="0.7"/>
      <path d="M20 20 L30 10 L40 20 L30 30 Z" fill="#B3DFF0" opacity="0.6"/>
    </svg>
  `;

  const gallery = document.getElementById('gallery');
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');
  const modalClose = document.getElementById('modalClose');

  function openModal(src, alt) {
    modalImg.src = src;
    modalImg.alt = alt || 'Postcard full view';
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  function render() {
    gallery.innerHTML = '';
    works.forEach((w, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${i * 0.1}s`;

      const hasImage = !!w.image;
      card.innerHTML = `
        <div class="frame ${hasImage ? '' : 'placeholder'}" ${hasImage ? `data-img="${w.image}" data-title="${w.title}"` : ''}>
          ${hasImage
            ? `<img src="${w.image}" alt="${w.title} postcard artwork">`
            : mascotSVG}
          ${hasImage ? '' : '<span class="badge">Coming soon</span>'}
        </div>
        <div class="card-title">${w.title}</div>
        <div class="card-sub">${w.sub}</div>
        <button class="dl-btn" ${hasImage ? '' : 'disabled'} data-i="${i}">
          ${hasImage ? '⬇ Download' : 'Not ready yet'}
        </button>
      `;
      gallery.appendChild(card);
    });

    document.querySelectorAll('.frame[data-img]').forEach(frame => {
      frame.addEventListener('click', (e) => {
        const imgSrc = frame.dataset.img;
        const title = frame.dataset.title || 'Postcard';
        openModal(imgSrc, title + ' full view');
      });
    });
  }

  gallery.addEventListener('click', (e) => {
    const btn = e.target.closest('.dl-btn');
    if (!btn || btn.disabled) return;
    e.stopPropagation();
    const w = works[btn.dataset.i];
    const a = document.createElement('a');
    a.href = w.image;
    a.download = `${w.title.replace(/\s+/g, '_')}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  render();
</script>
</body>
</html>
